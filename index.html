<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault - Password Manager</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-shield-halved text-emerald-400 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">SecureVault <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">Offline</span></h1>
        </div>
        <div id="auth-controls" class="hidden flex items-center space-x-3">
            <button onclick="changeMasterPassword()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-key mr-1 text-amber-400"></i> Cambia Master Key
            </button>
            <button onclick="lockVault()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-lock mr-1"></i> Blocca
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-center">

        <!-- LOCKSCREEN / SETUP MASTER PASSWORD -->
        <div id="lock-screen" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full mx-auto text-center">
            <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto mb-4 text-emerald-400 text-2xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 id="lock-title" class="text-2xl font-bold mb-2">Sblocca Vault</h2>
            <p id="lock-desc" class="text-slate-400 text-sm mb-6">Inserisci la tua Master Password per accedere ai dati salvati in locale.</p>
            
            <form id="master-form" onsubmit="handleMasterSubmit(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Master Password</label>
                    <input type="password" id="master-input" required placeholder="••••••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button type="submit" id="master-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-emerald-600/20 cursor-pointer">
                    Accedi
                </button>
            </form>

            <!-- Pulsante di sblocco/reset per eliminare il record corrotto dal vecchio bug del salt -->
            <div id="reset-box" class="mt-6 pt-4 border-t border-slate-800 hidden">
                <p class="text-xs text-slate-500 mb-2">Vault bloccato dal bug precedente o Master Key dimenticata?</p>
                <button type="button" onclick="resetCorruptedVault()" class="text-xs text-red-400 hover:text-red-300 underline cursor-pointer">
                    Resetta Vault Bloccato e Crea Nuova Master Key
                </button>
            </div>
        </div>

        <!-- APP DASHBOARD -->
        <div id="app-dashboard" class="hidden space-y-6">
            
            <!-- Toolbar azioni -->
            <div class="flex flex-wrap gap-3 justify-between items-center bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                <div class="flex flex-wrap gap-2">
                    <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition flex items-center shadow-lg shadow-emerald-600/20">
                        <i class="fa-solid fa-plus mr-2"></i> Nuova Credenziale
                    </button>
                    <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-4 py-2.5 rounded-xl border border-slate-700 transition flex items-center">
                        <i class="fa-solid fa-file-export mr-2 text-indigo-400"></i> Export CSV
                    </button>
                    <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-4 py-2.5 rounded-xl border border-slate-700 transition flex items-center cursor-pointer">
                        <i class="fa-solid fa-file-import mr-2 text-amber-400"></i> Import CSV
                        <input type="file" accept=".csv" onchange="importCSV(event)" class="hidden">
                    </label>
                </div>
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-500 text-sm"></i>
                    <input type="text" id="search-input" oninput="filterPasswords()" placeholder="Cerca account o URL..." class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Lista Credenziali -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="p-4 border-b border-slate-800 font-semibold text-sm text-slate-400 flex justify-between">
                    <span>Account Salvati</span>
                    <span id="counter-badge" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full">0 elementi</span>
                </div>
                <div id="passwords-list" class="divide-y divide-slate-800/60 max-h-[50vh] overflow-y-auto">
                    <!-- Elementi iniettati via JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- Modal Aggiunta / Modifica Credenziale -->
    <div id="credential-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold">Nuova Credenziale</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="saveCredential(event)" class="space-y-3">
                <input type="hidden" id="cred-edit-index" value="-1">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Titolo / Servizio</label>
                    <input type="text" id="cred-title" required placeholder="es. Google, Banca, Netflix" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Username / Email</label>
                    <input type="text" id="cred-user" required placeholder="nome@email.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                    <div class="flex gap-2">
                        <input type="text" id="cred-pass" required class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                        <button type="button" onclick="generateRandomPassword()" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl border border-slate-700 text-xs text-emerald-400 font-medium">Genera</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">URL (opzionale)</label>
                    <input type="text" id="cred-url" placeholder="https://..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="pt-2 flex gap-3">
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-sm font-medium transition">Annulla</button>
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-emerald-600/20">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script di Logica di Cifratura e Storage Corretto -->
    <script>
        let vaultData = [];
        let encryptionKey = null;
        let currentSalt = null; // FIX: Mantiene il salt coerente con la chiave derivata!

        function getStoredVault() {
            try {
                const raw = localStorage.getItem('secure_vault_encrypted');
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveKey"]
            );
            return window.crypto.subtle.deriveKey(
                {name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256"},
                keyMaterial,
                {name: "AES-GCM", length: 256},
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function handleMasterSubmit(e) {
            e.preventDefault();
            const password = document.getElementById('master-input').value;
            const stored = getStoredVault();

            if (!stored) {
                // Primo avvio: genera il salt e lo conserva in currentSalt
                currentSalt = window.crypto.getRandomValues(new Uint8Array(16));
                encryptionKey = await deriveKey(password, currentSalt);
                vaultData = [];
                await saveVault();
                initDashboard();
            } else {
                try {
                    currentSalt = new Uint8Array(stored.salt);
                    encryptionKey = await deriveKey(password, currentSalt);
                    const decrypted = await decryptData(stored.ciphertext, stored.iv);
                    vaultData = JSON.parse(decrypted);
                    initDashboard();
                } catch (err) {
                    alert('Master Password errata oppure il Vault precedente era bloccato dal bug del Salt. Se non riesci ad entrare, usa il tasto "Resetta Vault Bloccato" qui sotto.');
                    document.getElementById('reset-box').classList.remove('hidden');
                }
            }
        }

        async function saveVault() {
            // FIX CRITICO: Usa sempre il currentSalt con cui è stata generata encryptionKey!
            if (!currentSalt) {
                currentSalt = window.crypto.getRandomValues(new Uint8Array(16));
            }
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(JSON.stringify(vaultData));
            
            const encrypted = await window.crypto.subtle.encrypt(
                {name: "AES-GCM", iv: iv}, encryptionKey, encoded
            );

            const record = {
                salt: Array.from(currentSalt),
                iv: Array.from(iv),
                ciphertext: Array.from(new Uint8Array(encrypted))
            };
            localStorage.setItem('secure_vault_encrypted', JSON.stringify(record));
        }

        async function decryptData(ciphertext, iv) {
            const decrypted = await window.crypto.subtle.decrypt(
                {name: "AES-GCM", iv: new Uint8Array(iv)},
                encryptionKey,
                new Uint8Array(ciphertext)
            );
            return new TextDecoder().decode(decrypted);
        }

        function resetCorruptedVault() {
            if (confirm("Vuoi azzerare il Vault bloccato per impostare una nuova Master Password funzionante?")) {
                localStorage.removeItem('secure_vault_encrypted');
                encryptionKey = null;
                currentSalt = null;
                vaultData = [];
                document.getElementById('master-input').value = '';
                checkFirstSetup();
                alert("Vault resettato! Ora inserisci la tua nuova Master Password e premi 'Crea Vault'.");
            }
        }

        async function changeMasterPassword() {
            const newPass = prompt("Inserisci la nuova Master Password:");
            if (!newPass || newPass.trim().length < 4) {
                if (newPass !== null) alert("La password deve contenere almeno 4 caratteri.");
                return;
            }
            currentSalt = window.crypto.getRandomValues(new Uint8Array(16));
            encryptionKey = await deriveKey(newPass, currentSalt);
            await saveVault();
            alert("Master Password aggiornata con successo!");
        }

        function initDashboard() {
            document.getElementById('lock-screen').classList.add('hidden');
            document.getElementById('app-dashboard').classList.remove('hidden');
            document.getElementById('auth-controls').classList.remove('hidden');
            document.getElementById('master-input').value = '';
            renderPasswords();
        }

        function lockVault() {
            encryptionKey = null;
            currentSalt = null;
            vaultData = [];
            document.getElementById('app-dashboard').classList.add('hidden');
            document.getElementById('auth-controls').classList.add('hidden');
            document.getElementById('lock-screen').classList.remove('hidden');
            checkFirstSetup();
        }

        function checkFirstSetup() {
            const stored = getStoredVault();
            if (!stored) {
                document.getElementById('lock-title').innerText = "Crea Master Password";
                document.getElementById('lock-desc').innerText = "Imposta una password sicura per crittografare il tuo nuovo database offline.";
                document.getElementById('master-btn').innerText = "Crea Vault";
                document.getElementById('reset-box').classList.add('hidden');
            } else {
                document.getElementById('lock-title').innerText = "Sblocca Vault";
                document.getElementById('lock-desc').innerText = "Inserisci la Master Password per accedere.";
                document.getElementById('master-btn').innerText = "Accedi";
                document.getElementById('reset-box').classList.remove('hidden');
            }
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function copyPasswordByIndex(realIndex) {
            const item = vaultData[realIndex];
            if (!item) return;
            navigator.clipboard.writeText(item.password);
        }

        function renderPasswords(filter = '') {
            const listContainer = document.getElementById('passwords-list');
            listContainer.innerHTML = '';
            
            const q = filter.toLowerCase();
            const indexedItems = vaultData
                .map((item, realIndex) => ({ item, realIndex }))
                .filter(({ item }) => 
                    item.title.toLowerCase().includes(q) || 
                    item.username.toLowerCase().includes(q) ||
                    (item.url && item.url.toLowerCase().includes(q))
                );

            document.getElementById('counter-badge').innerText = `${vaultData.length} elementi`;

            if (indexedItems.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-500 text-sm">Nessuna credenziale trovata.</div>`;
                return;
            }

            indexedItems.forEach(({ item, realIndex }) => {
                const div = document.createElement('div');
                div.className = "p-4 flex items-center justify-between hover:bg-slate-800/40 transition";
                div.innerHTML = `
                    <div class="space-y-0.5">
                        <h4 class="font-bold text-sm text-slate-200">${escapeHtml(item.title)}</h4>
                        <p class="text-xs text-slate-400 font-mono">${escapeHtml(item.username)}</p>
                        ${item.url ? `<p class="text-xs text-emerald-400/80 truncate max-w-xs">${escapeHtml(item.url)}</p>` : ''}
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="copyPasswordByIndex(${realIndex})" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs border border-slate-700 transition" title="Copia Password">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                        <button onclick="editCredential(${realIndex})" class="text-slate-400 hover:text-white p-2 text-xs" title="Modifica">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteCredential(${realIndex})" class="text-red-400 hover:text-red-300 p-2 text-xs" title="Elimina">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function filterPasswords() {
            const query = document.getElementById('search-input').value;
            renderPasswords(query);
        }

        function openAddModal() {
            document.getElementById('modal-title').innerText = 'Nuova Credenziale';
            document.getElementById('cred-edit-index').value = '-1';
            document.getElementById('credential-modal').classList.remove('hidden');
        }

        function editCredential(realIndex) {
            const item = vaultData[realIndex];
            if (!item) return;
            document.getElementById('modal-title').innerText = 'Modifica Credenziale';
            document.getElementById('cred-edit-index').value = String(realIndex);
            document.getElementById('cred-title').value = item.title;
            document.getElementById('cred-user').value = item.username;
            document.getElementById('cred-pass').value = item.password;
            document.getElementById('cred-url').value = item.url || '';
            document.getElementById('credential-modal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('credential-modal').classList.add('hidden');
            document.getElementById('cred-edit-index').value = '-1';
            document.getElementById('cred-title').value = '';
            document.getElementById('cred-user').value = '';
            document.getElementById('cred-pass').value = '';
            document.getElementById('cred-url').value = '';
        }

        async function saveCredential(e) {
            e.preventDefault();
            const editIndex = parseInt(document.getElementById('cred-edit-index').value, 10);
            const title = document.getElementById('cred-title').value.trim();
            const username = document.getElementById('cred-user').value.trim();
            const password = document.getElementById('cred-pass').value;
            const url = document.getElementById('cred-url').value.trim();

            if (editIndex >= 0 && editIndex < vaultData.length) {
                vaultData[editIndex] = { title, username, password, url };
            } else {
                vaultData.push({ title, username, password, url });
            }

            await saveVault();
            closeAddModal();
            filterPasswords();
        }

        async function deleteCredential(realIndex) {
            if (confirm("Vuoi eliminare questa credenziale?")) {
                vaultData.splice(realIndex, 1);
                await saveVault();
                filterPasswords();
            }
        }

        function generateRandomPassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";
            let pass = "";
            for (let i = 0; i < 16; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('cred-pass').value = pass;
        }

        function exportCSV() {
            let csv = "Titolo,Username,Password,URL\n";
            vaultData.forEach(item => {
                const t = (item.title || '').replace(/"/g, '""');
                const u = (item.username || '').replace(/"/g, '""');
                const p = (item.password || '').replace(/"/g, '""');
                const l = (item.url || '').replace(/"/g, '""');
                csv += `"${t}","${u}","${p}","${l}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'securevault_backup.csv');
            a.click();
        }

        function importCSV(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(event) {
                const text = event.target.result;
                const lines = text.split("\n");
                let addedCount = 0;
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const cols = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                    if (cols && cols.length >= 3) {
                        const title = cols[0].replace(/^"|"$/g, '').replace(/""/g, '"').trim();
                        const username = cols[1].replace(/^"|"$/g, '').replace(/""/g, '"').trim();
                        const password = cols[2].replace(/^"|"$/g, '').replace(/""/g, '"').trim();
                        const url = cols[3] ? cols[3].replace(/^"|"$/g, '').replace(/""/g, '"').trim() : '';
                        vaultData.push({ title, username, password, url });
                        addedCount++;
                    }
                }
                if (addedCount > 0) {
                    await saveVault();
                    renderPasswords();
                    alert(`Importati con successo ${addedCount} elementi!`);
                } else {
                    alert('Nessun record valido trovato nel file CSV.');
                }
            };
            reader.readAsText(file);
        }

        checkFirstSetup();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registrato:', reg.scope))
                    .catch((err) => console.log('Service Worker fallito:', err));
            });
        }
    </script>
</body>
</html>
