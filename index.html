<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault v2 - Sbloccato</title>
    <meta name="theme-color" content="#030712">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // 1. UCCIDE IMMEDIATAMENTE IL VECCHIO SERVICE WORKER E LA VECCHIA CACHE
        (async function killOldCache() {
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let reg of registrations) {
                    await reg.unregister();
                }
            }
            if ('caches' in window) {
                const keys = await caches.keys();
                for (let key of keys) {
                    await caches.delete(key);
                }
            }
            // Rimuove anche il vecchio record bloccato della v1
            localStorage.removeItem('secure_vault_encrypted');
        })();
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Toast di conferma copia -->
    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg transition-opacity duration-200 opacity-0 pointer-events-none z-50">
        Copiato negli appunti!
    </div>

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md sticky top-0 z-30">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-shield-halved text-emerald-400 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">
                SecureVault <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">v2 Sbloccata</span>
            </h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="hardResetVault()" class="text-xs bg-red-950/60 hover:bg-red-900 text-red-300 px-3 py-1.5 rounded-lg border border-red-800/50 transition cursor-pointer">
                <i class="fa-solid fa-rotate-right mr-1"></i> Reset Totale
            </button>
            <div id="auth-controls" class="hidden flex items-center space-x-2">
                <button onclick="lockVault()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition cursor-pointer">
                    <i class="fa-solid fa-lock mr-1"></i> Blocca
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-center">

        <!-- LOCKSCREEN / SETUP MASTER PASSWORD -->
        <div id="lock-screen" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full mx-auto text-center">
            <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto mb-4 text-emerald-400 text-2xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 id="lock-title" class="text-2xl font-bold mb-2">Crea Master Password</h2>
            <p id="lock-desc" class="text-slate-400 text-sm mb-6">Imposta una password sicura per crittografare il tuo database offline.</p>
            
            <form id="master-form" onsubmit="handleMasterSubmit(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Master Password</label>
                    <input type="password" id="master-input" required placeholder="••••••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button type="submit" id="master-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-emerald-600/20 cursor-pointer">
                    Entra nel Vault
                </button>
            </form>
        </div>

        <!-- APP DASHBOARD -->
        <div id="app-dashboard" class="hidden space-y-6">
            
            <!-- Toolbar azioni -->
            <div class="flex flex-wrap gap-3 justify-between items-center bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                <div class="flex flex-wrap gap-2">
                    <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition flex items-center shadow-lg shadow-emerald-600/20 cursor-pointer">
                        <i class="fa-solid fa-plus mr-2"></i> Nuova
                    </button>
                    <label class="bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 text-sm font-semibold px-4 py-2.5 rounded-xl border border-amber-500/40 transition flex items-center cursor-pointer">
                        <i class="fa-solid fa-file-import mr-2"></i> Importa CSV Google
                        <input type="file" accept=".csv,text/csv" onchange="importCSV(event)" class="hidden">
                    </label>
                    <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-4 py-2.5 rounded-xl border border-slate-700 transition flex items-center cursor-pointer">
                        <i class="fa-solid fa-file-export mr-2 text-indigo-400"></i> Export CSV
                    </button>
                    <button onclick="clearAllPasswords()" class="bg-red-950/40 hover:bg-red-900/50 text-red-300 text-sm font-medium px-3 py-2.5 rounded-xl border border-red-800/40 transition flex items-center cursor-pointer">
                        <i class="fa-solid fa-trash-can mr-1.5"></i> Svuota Lista
                    </button>
                </div>
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-slate-500 text-sm"></i>
                    <input type="text" id="search-input" oninput="filterPasswords()" placeholder="Cerca sito, email o username..." class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Lista Credenziali -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="p-4 border-b border-slate-800 font-semibold text-sm text-slate-400 flex justify-between items-center">
                    <span>Account Salvati (Tocca una riga o l'occhio 👁️ per vedere la password)</span>
                    <span id="counter-badge" class="text-xs bg-slate-800 px-2.5 py-1 rounded-full text-emerald-400">0 elementi</span>
                </div>
                <div id="passwords-list" class="divide-y divide-slate-800/60 max-h-[62vh] overflow-y-auto">
                </div>
            </div>
        </div>

    </main>

    <!-- Modal Dettagli / Modifica Credenziale -->
    <div id="credential-modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold">Dettagli Credenziale</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="saveCredential(event)" class="space-y-3">
                <input type="hidden" id="cred-edit-index" value="-1">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Titolo / Sito</label>
                    <input type="text" id="cred-title" required placeholder="es. Google, Amazon, Banca" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Username / Email</label>
                    <div class="flex gap-2">
                        <input type="text" id="cred-user" placeholder="nome@email.com" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-mono focus:outline-none focus:border-emerald-500">
                        <button type="button" onclick="copyText(document.getElementById('cred-user').value, 'Username copiato!')" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl border border-slate-700 text-xs text-slate-200 cursor-pointer">
                            <i class="fa-solid fa-copy"></i> Copia
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password in chiaro</label>
                    <div class="flex gap-2">
                        <input type="text" id="cred-pass" required class="flex-1 bg-slate-950 border border-emerald-500/60 rounded-xl px-3 py-2.5 text-sm font-mono text-emerald-300 focus:outline-none focus:border-emerald-500">
                        <button type="button" onclick="copyText(document.getElementById('cred-pass').value, 'Password copiata!')" class="bg-emerald-600/20 hover:bg-emerald-600/30 px-3 py-2 rounded-xl border border-emerald-500/40 text-xs text-emerald-300 font-semibold cursor-pointer">
                            <i class="fa-solid fa-copy mr-1"></i> Copia
                        </button>
                        <button type="button" onclick="generateRandomPassword()" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl border border-slate-700 text-xs text-amber-400 font-medium cursor-pointer" title="Genera password casuale">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">URL del Sito</label>
                    <input type="text" id="cred-url" placeholder="https://..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Note</label>
                    <input type="text" id="cred-note" placeholder="Note aggiuntive..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="pt-3 flex gap-3">
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer">Chiudi</button>
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-emerald-600/20 cursor-pointer">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Nuova chiave storage pulita che ignora il vecchio blocco corrotto
        const STORAGE_KEY = 'secure_vault_v2_clean';
        let vaultData = [];
        let encryptionKey = null;
        let currentSalt = null;
        let visiblePasswords = new Set();

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 1800);
        }

        function copyText(text, msg = 'Copiato!') {
            if (!text) return;
            navigator.clipboard.writeText(text);
            showToast(msg);
        }

        function getStoredVault() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveKey"]
            );
            return window.crypto.subtle.deriveKey(
                {name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256"},
                keyMaterial,
                {name: "AES-GCM", length: 256},
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function handleMasterSubmit(e) {
            e.preventDefault();
            const password = document.getElementById('master-input').value;
            const stored = getStoredVault();

            if (!stored) {
                currentSalt = window.crypto.getRandomValues(new Uint8Array(16));
                encryptionKey = await deriveKey(password, currentSalt);
                vaultData = [];
                await saveVault();
                initDashboard();
            } else {
                try {
                    currentSalt = new Uint8Array(stored.salt);
                    encryptionKey = await deriveKey(password, currentSalt);
                    const decrypted = await decryptData(stored.ciphertext, stored.iv);
                    vaultData = JSON.parse(decrypted);
                    initDashboard();
                } catch (err) {
                    if (confirm("Password errata. Vuoi resettare il Vault e crearne uno nuovo con la password appena inserita?")) {
                        currentSalt = window.crypto.getRandomValues(new Uint8Array(16));
                        encryptionKey = await deriveKey(password, currentSalt);
                        vaultData = [];
                        await saveVault();
                        initDashboard();
                    }
                }
            }
        }

        async function saveVault() {
            if (!currentSalt) {
                currentSalt = window.crypto.getRandomValues(new Uint8Array(16));
            }
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(JSON.stringify(vaultData));
            
            const encrypted = await window.crypto.subtle.encrypt(
                {name: "AES-GCM", iv: iv}, encryptionKey, encoded
            );

            const record = {
                salt: Array.from(currentSalt),
                iv: Array.from(iv),
                ciphertext: Array.from(new Uint8Array(encrypted))
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(record));
        }

        async function decryptData(ciphertext, iv) {
            const decrypted = await window.crypto.subtle.decrypt(
                {name: "AES-GCM", iv: new Uint8Array(iv)},
                encryptionKey,
                new Uint8Array(ciphertext)
            );
            return new TextDecoder().decode(decrypted);
        }

        function hardResetVault() {
            if (confirm("Vuoi azzerare completamente il Vault e impostare una nuova Master Password?")) {
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem('secure_vault_encrypted');
                encryptionKey = null;
                currentSalt = null;
                vaultData = [];
                lockVault();
            }
        }

        async function clearAllPasswords() {
            if (confirm("Vuoi svuotare la lista delle password salvate?")) {
                vaultData = [];
                visiblePasswords.clear();
                await saveVault();
                renderPasswords();
                showToast("Lista svuotata!");
            }
        }

        function initDashboard() {
            document.getElementById('lock-screen').classList.add('hidden');
            document.getElementById('app-dashboard').classList.remove('hidden');
            document.getElementById('auth-controls').classList.remove('hidden');
            document.getElementById('master-input').value = '';
            renderPasswords();
        }

        function lockVault() {
            encryptionKey = null;
            currentSalt = null;
            vaultData = [];
            visiblePasswords.clear();
            document.getElementById('app-dashboard').classList.add('hidden');
            document.getElementById('auth-controls').classList.add('hidden');
            document.getElementById('lock-screen').classList.remove('hidden');
            checkFirstSetup();
        }

        function checkFirstSetup() {
            const stored = getStoredVault();
            if (!stored) {
                document.getElementById('lock-title').innerText = "Crea Master Password";
                document.getElementById('lock-desc').innerText = "Imposta una password per crittografare il tuo nuovo Vault.";
                document.getElementById('master-btn').innerText = "Crea e Accedi";
            } else {
                document.getElementById('lock-title').innerText = "
